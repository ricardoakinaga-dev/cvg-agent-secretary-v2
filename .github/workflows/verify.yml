name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cvg_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cvg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Construction readiness
        run: npm run readiness

      - name: Verify
        run: npm run verify

      - name: Diff check
        run: git diff --check

      - name: Worker startup fail-closed smoke
        run: npm run test:worker:startup

      - name: Production preflight remains fail-closed
        run: npm run production:preflight -- --expect=REJECT

      - name: Agent evals
        run: npm run test:evals

      - name: Chaos suite
        run: npm run test:chaos

      - name: Dependency licenses
        run: npm run licenses:check

      - name: SBOM
        run: npm run sbom

      - name: PostgreSQL migration smoke
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cvg_test
        run: npm run test:postgres

      - name: E2E
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e
